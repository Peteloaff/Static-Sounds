<style>
  :root, [data-theme="dark"]{
    --bg:#0A0A0C; --card:rgba(255,255,255,.045); --card-solid:#131316; --card-2:rgba(255,255,255,.03);
    --line:rgba(255,255,255,.09); --text:#F5F5F7; --muted:#8C8C93;
    --red:#FF3B2F; --yellow:#FFC400; --grad:linear-gradient(135deg, var(--red), var(--yellow));
    --danger:#FF6B5E; --shadow:0 20px 50px rgba(0,0,0,.5);
  }
  [data-theme="light"]{
    --bg:#F2F1EE; --card:rgba(255,255,255,.65); --card-solid:#FFFFFF; --card-2:rgba(0,0,0,.02);
    --line:rgba(0,0,0,.08); --text:#18171B; --muted:#6B6A70;
    --red:#E8342A; --yellow:#E8A400; --grad:linear-gradient(135deg, var(--red), var(--yellow));
    --danger:#C21A0E; --shadow:0 20px 50px rgba(0,0,0,.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(700px 500px at 85% -8%, color-mix(in srgb, var(--yellow) 16%, transparent), transparent 60%),
      radial-gradient(800px 600px at -10% 15%, color-mix(in srgb, var(--red) 14%, transparent), transparent 60%),
      var(--bg);
    color:var(--text); font-family:'Inter',sans-serif; min-height:100vh;
    padding:24px 14px 60px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:440px;margin:0 auto;}

  /* ---- header ---- */
  .brandbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .brand{display:flex;align-items:center;gap:11px;}
  .logo-badge{width:36px;height:36px;border-radius:11px;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px color-mix(in srgb, var(--red) 45%, transparent);flex:none;}
  .logo-badge svg{width:20px;height:20px;}
  .wordmark{font-family:'Unbounded',sans-serif;font-weight:700;font-size:19px;letter-spacing:-.01em;color:var(--text);line-height:1;}
  .wordmark span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .tagline{color:var(--muted);font-size:12px;margin:3px 0 0;font-family:'JetBrains Mono',monospace;}

  .theme-toggle{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;backdrop-filter:blur(16px);}
  .theme-toggle button{background:none;border:none;color:var(--muted);width:28px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .theme-toggle button.active{background:var(--grad);color:#0A0A0C;}
  .theme-toggle svg{width:13px;height:13px;}

  .configWarn{background:color-mix(in srgb, var(--red) 16%, transparent);border:1px solid var(--red);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;border-radius:12px;padding:11px 13px;margin-bottom:14px;}

  /* ---- cards ---- */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    box-shadow:var(--shadow); margin-bottom:14px; overflow:hidden;
  }
  .card-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;cursor:default;}
  .card-head .cap{font-family:'Inter',sans-serif;font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .collapse-btn{background:var(--card-2);border:1px solid var(--line);width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);transition:transform .25s ease;}
  .collapse-btn svg{width:12px;height:12px;transition:transform .25s ease;}
  .card.shaded .collapse-btn svg{transform:rotate(-90deg);}
  .card-body{padding:0 18px 18px;}
  .card.shaded .card-body{display:none;}

  label{display:block;font-size:11px;letter-spacing:.04em;color:var(--muted);margin:0 0 7px;}
  input[type=text]{
    width:100%;background:var(--card-2);border:1px solid var(--line);border-radius:12px;color:var(--text);
    font-family:'JetBrains Mono',monospace;font-size:13px;padding:12px 13px;margin-bottom:11px;outline:none;
  }
  input[type=text]:focus{border-color:var(--red);}
  input[type=text]::placeholder{color:var(--muted);}

  button.primary{
    background:var(--grad);color:#0A0A0C;border:none;border-radius:12px;
    font-family:'Inter',sans-serif;font-weight:700;font-size:13px;letter-spacing:.01em;
    padding:12px 16px;cursor:pointer;width:100%;
  }
  button.primary:disabled{opacity:.5;cursor:default;}
  button.primary:active{filter:brightness(.92);}
  button.ghost{
    background:var(--card-2);border:1px solid var(--line);color:var(--text);border-radius:10px;
    font-size:11px;font-weight:600;letter-spacing:.03em;padding:8px 13px;cursor:pointer;font-family:'Inter',sans-serif;
  }
  button.ghost:active{filter:brightness(.9);}

  .status{font-size:12px;margin-top:6px;font-family:'JetBrains Mono',monospace;}
  .status.err{color:var(--danger);}
  .status.ok{color:var(--red);}
  .install-tip{font-size:11px;color:var(--muted);text-align:center;margin-top:10px;font-family:'JetBrains Mono',monospace;line-height:1.6;}

  /* ---- deck ---- */
  .deck-top{display:flex;gap:14px;align-items:center;margin-bottom:4px;}
  .reels{width:46px;height:46px;flex:none;position:relative;border-radius:50%;background:var(--card-2);border:1px solid var(--line);}
  .reel{width:100%;height:100%;border-radius:50%;position:relative;animation:spin 3.2s linear infinite;animation-play-state:paused;}
  .reel.spinning{animation-play-state:running;}
  .reel::after{content:'';position:absolute;inset:0;margin:auto;width:9px;height:9px;border-radius:50%;background:var(--grad);}
  .reel::before{content:'';position:absolute;top:3px;left:50%;width:2px;height:8px;background:var(--line);transform:translateX(-50%);}
  @keyframes spin{to{transform:rotate(360deg);}}
  .now-playing{min-width:0;flex:1;}
  .np-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin:0 0 3px;}
  .np-title-wrap{overflow:hidden;white-space:nowrap;}
  .np-title{font-family:'Unbounded',sans-serif;font-weight:700;font-size:16px;color:var(--text);display:inline-block;}
  .np-title-wrap.scroll .np-title{padding-left:100%;animation:marquee linear infinite;}
  @keyframes marquee{from{transform:translateX(0);}to{transform:translateX(-100%);}}

  .progress-row{display:flex;align-items:center;gap:9px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-top:12px;}
  .progress-track{flex:1;height:5px;background:var(--card-2);border:1px solid var(--line);border-radius:99px;position:relative;cursor:pointer;}
  .progress-fill{position:absolute;left:0;top:-1px;bottom:-1px;background:var(--grad);border-radius:99px;width:0%;}

  .vis-head{display:flex;align-items:center;justify-content:space-between;margin-top:16px;margin-bottom:8px;}
  .vis-head .cap-sm{font-family:'Inter',sans-serif;font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .vis-tabs{display:flex;gap:3px;background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:3px;}
  .vis-tab{background:none;border:none;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.04em;padding:4px 9px;border-radius:7px;cursor:pointer;}
  .vis-tab.active{background:var(--grad);color:#0A0A0C;}
  .vis-canvas{width:100%;height:76px;display:block;background:var(--card-2);border:1px solid var(--line);border-radius:14px;}

  .controls{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px;}
  .ctrl-btn{
    background:var(--card-2);border:1px solid var(--line);color:var(--text);
    width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .ctrl-btn:active{filter:brightness(.9);}
  .ctrl-btn.play{width:52px;height:52px;border-radius:16px;background:var(--grad);color:#0A0A0C;border:none;}
  .ctrl-btn.shuffle.on{color:var(--red);border-color:var(--red);}
  .ctrl-btn svg{width:15px;height:15px;}
  .ctrl-btn.play svg{width:19px;height:19px;}


  /* ---- library / playlists ---- */
  .folder-group{margin-bottom:14px;}
  .folder-head{display:flex;align-items:center;gap:8px;padding:2px 2px 8px;margin-bottom:4px;border-bottom:1px solid var(--line);}
  .folder-head .fname{flex:1;min-width:0;font-family:'Inter',sans-serif;font-weight:700;font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .folder-head .fcount{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);}
  .folder-head .remove{background:none;border:none;color:var(--muted);cursor:pointer;font-size:10px;}
  .folder-collapse{background:var(--card-2);border:1px solid var(--line);width:20px;height:20px;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);flex:none;padding:0;}
  .folder-collapse svg{width:11px;height:11px;transition:transform .2s ease;}
  .folder-group.collapsed .folder-collapse svg{transform:rotate(-90deg);}
  .folder-group.collapsed .folder-tracks{display:none;}
  .track{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:10px;cursor:pointer;font-size:13px;}
  .track:hover{background:var(--card-2);}
  .track.active{background:color-mix(in srgb, var(--red) 14%, transparent);}
  .track input[type=checkbox]{accent-color:var(--red);flex:none;}
  .track-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'JetBrains Mono',monospace;}
  .track.active .track-name{color:var(--red);}
  .track-eq{width:13px;flex:none;display:none;}
  .track.active .track-eq{display:block;}
  .eq-bar{display:inline-block;width:2px;background:var(--red);margin-right:2px;height:5px;vertical-align:middle;border-radius:1px;}
  .track.playing .eq-bar{animation:eqbar 0.8s ease-in-out infinite alternate;}
  .eq-bar:nth-child(2){animation-delay:.15s;}
  .eq-bar:nth-child(3){animation-delay:.3s;}
  @keyframes eqbar{from{height:2px;}to{height:9px;}}

  .selection-bar{position:sticky;bottom:0;background:var(--card-solid);border:1px solid var(--red);border-radius:14px;padding:12px;display:none;gap:7px;align-items:center;margin-top:8px;flex-wrap:wrap;}
  .selection-bar.show{display:flex;}
  .selection-bar span{font-size:11px;color:var(--muted);flex:1 1 100%;font-family:'JetBrains Mono',monospace;}
  .selection-bar input{margin:0;flex:1;min-width:100px;}
  .selection-bar button{flex:none;}

  .playlist-row{display:flex;align-items:center;gap:9px;padding:10px 8px;border-radius:12px;cursor:pointer;}
  .playlist-row:hover{background:var(--card-2);}
  .playlist-row .pname{flex:1;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;}
  .playlist-row .pcount{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);}
  .playlist-row .pdel{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 5px;}
  .playlist-row .pdel:hover{color:var(--danger);}

  .empty{text-align:center;color:var(--muted);font-size:12px;padding:18px 8px;font-family:'JetBrains Mono',monospace;}
  footer{text-align:center;color:var(--muted);font-size:10px;margin-top:20px;font-family:'JetBrains Mono',monospace;opacity:.7;}
</style>
</head>
<body>

  <!-- Library -->
  <div class="card" id="libraryWin">

    <div class="card-body">

        <span id="selectionCount">0 selected</span>
        <input type="text" id="playlistNameInput" placeholder="Playlist name">

  <!-- Add folder -->

    <div class="card-body">

<script>
/* =========================================================================
   CONFIG
   ========================================================================= */
const API_KEY = 'AIzaSyDTD4v7TCNL8CzImICG3b_Wefiaz1Nw0aU';
const DEFAULT_FOLDER_ID = '1AcBAI4uLHdb3HRcwyKzno60WhK57PhoJ';
/* ========================================================================= */

const els = id => document.getElementById(id);
const configWarn = els('configWarn');
const folderInput = els('folderInput'), addFolderBtn = els('addFolderBtn'), statusMsg = els('statusMsg');
const libraryList = els('libraryList'), playlistsList = els('playlistsList');
const selectionBar = els('selectionBar'), selectionCount = els('selectionCount'), playlistNameInput = els('playlistNameInput');
const deckWin = els('deckWin'), queueLabel = els('queueLabel');
const npTitle = els('npTitle'), reel = els('reel'), audioEl = els('audioEl');
const playBtn = els('playBtn'), playIcon = els('playIcon'), prevBtn = els('prevBtn'), nextBtn = els('nextBtn'), shuffleBtn = els('shuffleBtn'), stopBtn = els('stopBtn');
const npTitleWrap = els('npTitleWrap');
const progressTrack = els('progressTrack'), progressFill = els('progressFill'), curTimeEl = els('curTime'), durTimeEl = els('durTime');
const darkBtn = els('darkBtn'), lightBtn = els('lightBtn');
const visCanvas = els('visCanvas'), visCtx = visCanvas.getContext('2d');

if (!API_KEY || API_KEY === 'YOUR_API_KEY') {
  configWarn.style.display = 'block';
  configWarn.textContent = 'Setup needed: replace API_KEY at the top of the script.';
  libraryList.innerHTML = '<div class="empty">Add your API key to load the preloaded folder.</div>';
} else {
  window.addEventListener('DOMContentLoaded', () => addFolder(DEFAULT_FOLDER_ID));
}

/* ---------- Window shade toggles ---------- */
document.querySelectorAll('.shade-btn').forEach(btn => {
  btn.addEventListener('click', () => { els(btn.dataset.target).classList.toggle('shaded'); });
});

/* ---------- Storage ---------- */
const store = {
  async get(key) {
    if (window.storage) { try { const r = await window.storage.get(key); return r ? JSON.parse(r.value) : null; } catch (e) { return null; } }
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch (e) { console.error('store.get failed', key, e); return null; }
  },
  async set(key, value) {
    if (window.storage) { try { await window.storage.set(key, JSON.stringify(value)); return true; } catch (e) { console.error('window.storage.set failed', key, e); } }
    try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { console.error('localStorage.set failed', key, e); return false; }
  }
};

/* ---------- Theme ---------- */
let REDC = '#FF2B22';
function refreshRedColor() { REDC = getComputedStyle(document.documentElement).getPropertyValue('--red').trim() || REDC; }
async function initTheme() {
  let theme = await store.get('ss_theme');
  if (!theme) theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  applyTheme(theme);
}
function applyTheme(theme) { document.documentElement.setAttribute('data-theme', theme); darkBtn.classList.toggle('active', theme === 'dark'); lightBtn.classList.toggle('active', theme === 'light'); refreshRedColor(); }
darkBtn.addEventListener('click', () => { applyTheme('dark'); store.set('ss_theme', 'dark'); });
lightBtn.addEventListener('click', () => { applyTheme('light'); store.set('ss_theme', 'light'); });
initTheme();

/* ---------- Library ---------- */
let folders = [];
let selected = new Map();
let folderCollapsed = new Set();
function extractFolderId(raw) { raw = raw.trim(); const m = raw.match(/folders\/([a-zA-Z0-9_-]+)/); if (m) return m[1]; const m2 = raw.match(/[-\w]{25,}/); if (m2) return m2[0]; return raw; }
function setStatus(msg, type) { statusMsg.textContent = msg || ''; statusMsg.className = 'status' + (type ? ' ' + type : ''); }
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

addFolderBtn.addEventListener('click', () => addFolder(folderInput.value));

async function addFolder(rawInput) {
  const folderId = extractFolderId(rawInput);
  if (!folderId) { setStatus('Paste a folder link or ID first.', 'err'); return; }
  if (folders.some(f => f.id === folderId)) { setStatus('That folder is already loaded.', 'err'); return; }
  addFolderBtn.disabled = true; setStatus('Reading the folder…');
  try {
    const [metaRes, listRes] = await Promise.all([
      fetch(`https://www.googleapis.com/drive/v3/files/${folderId}?fields=id,name&key=${API_KEY}`),
      fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(`'${folderId}' in parents and (mimeType contains 'audio/' or mimeType='video/mp4') and trashed=false`)}&fields=${encodeURIComponent('files(id,name,mimeType)')}&pageSize=1000&key=${API_KEY}`)
    ]);
    if (!metaRes.ok || !listRes.ok) { const err = !metaRes.ok ? await metaRes.json().catch(()=>({})) : await listRes.json().catch(()=>({})); throw new Error(err?.error?.message || 'Drive request failed — check the folder is shared as "Anyone with the link."'); }
    const meta = await metaRes.json(); const list = await listRes.json();
    const tracks = (list.files || []).sort((a,b) => a.name.localeCompare(b.name, undefined, {numeric:true})).map(f => ({ id: f.id, name: f.name.replace(/\.[^/.]+$/, '') }));
    if (!tracks.length) { setStatus('That folder loaded, but no audio files turned up in it.', 'err'); addFolderBtn.disabled = false; return; }
    folders.push({ id: folderId, name: meta.name || 'Untitled folder', tracks });
    if (folderInput.value.trim() === rawInput.trim()) folderInput.value = '';
    setStatus(`Loaded "${meta.name}" — ${tracks.length} track${tracks.length===1?'':'s'}.`, 'ok');
    renderLibrary();
    if (folderId === DEFAULT_FOLDER_ID) await syncMasterPlaylist(tracks);
  } catch (err) { console.error('addFolder failed', err); setStatus("Couldn't load that folder — " + err.message, 'err'); }
  finally { addFolderBtn.disabled = false; }
}

/* A default "SR" playlist that always mirrors the main folder's current
   tracks, so everyone who opens the app sees it right away — not something
   they have to build themselves. Fixed id so it's created once and kept in
   sync on every load rather than duplicated. */
async function syncMasterPlaylist(tracks) {
  try {
    const playlists = (await store.get('ss_playlists')) || [];
    const idx = playlists.findIndex(p => p.id === 'pl_master_sr');
    const entry = { id: 'pl_master_sr', name: 'SR', tracks: tracks.map(t => ({ id: t.id, name: t.name })) };
    if (idx > -1) playlists[idx] = entry; else playlists.unshift(entry);
    await store.set('ss_playlists', playlists);
    await renderPlaylists();
  } catch (err) { console.error('syncMasterPlaylist failed', err); }
}

function renderLibrary() {
  if (!folders.length) { libraryList.innerHTML = '<div class="empty">No folders loaded yet.</div>'; return; }
  libraryList.innerHTML = '';
  folders.forEach(folder => {
    const group = document.createElement('div'); group.className = 'folder-group';
    const collapsed = folderCollapsed.has(folder.id);
    group.innerHTML = `<div class="folder-head">
        <button class="folder-collapse" data-folder="${folder.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button>
        <span class="fname">${escapeHtml(folder.name)}</span>
        <span class="fcount">${folder.tracks.length} trk</span>
        <button class="remove" data-folder="${folder.id}">remove</button>
      </div>`;
    if (collapsed) group.classList.add('collapsed');
    const list = document.createElement('div'); list.className = 'folder-tracks';
    folder.tracks.forEach(t => {
      const row = document.createElement('div'); row.className = 'track'; row.dataset.id = t.id;
      row.innerHTML = `<input type="checkbox" ${selected.has(t.id) ? 'checked' : ''}><span class="track-name">${folder.tracks.indexOf(t) + 1}. ${escapeHtml(t.name)}</span><span class="track-eq"><span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span></span>`;
      row.querySelector('input').addEventListener('change', (e) => { if (e.target.checked) selected.set(t.id, t); else selected.delete(t.id); updateSelectionBar(); });
      row.querySelector('.track-name').addEventListener('click', () => playAdhoc(folder.tracks, folder.tracks.indexOf(t), folder.name));
      list.appendChild(row);
    });
    group.appendChild(list);
    group.querySelector('.remove').addEventListener('click', () => { folders = folders.filter(f => f.id !== folder.id); renderLibrary(); });
    group.querySelector('.folder-collapse').addEventListener('click', () => {
      if (folderCollapsed.has(folder.id)) folderCollapsed.delete(folder.id); else folderCollapsed.add(folder.id);
      renderLibrary();
    });
    libraryList.appendChild(group);
  });
}
function updateSelectionBar() { selectionBar.classList.toggle('show', selected.size > 0); selectionCount.textContent = `${selected.size} selected`; }

els('saveSelectionBtn').addEventListener('click', async () => {
  const name = playlistNameInput.value.trim();
  if (!name) { setStatus('Give the playlist a name.', 'err'); return; }
  if (!selected.size) { setStatus('Check at least one track first.', 'err'); return; }
  try {
    const playlists = (await store.get('ss_playlists')) || [];
    playlists.push({ id: 'pl_' + Date.now(), name, tracks: Array.from(selected.values()) });
    const ok = await store.set('ss_playlists', playlists);
    if (!ok) { setStatus('Could not save — your browser may be blocking local storage.', 'err'); return; }
    selected.clear(); playlistNameInput.value = ''; updateSelectionBar(); renderLibrary();
    await renderPlaylists();
    setStatus(`Saved playlist "${name}".`, 'ok');
  } catch (err) { console.error('save playlist failed', err); setStatus('Could not save that playlist — ' + err.message, 'err'); }
});
els('playSelectionBtn').addEventListener('click', () => { if (!selected.size) { setStatus('Check at least one track first.', 'err'); return; } playAdhoc(Array.from(selected.values()), 0, 'Selection'); });

async function renderPlaylists() {
  let playlists = [];
  try { playlists = (await store.get('ss_playlists')) || []; } catch (err) { console.error('load playlists failed', err); }
  if (!playlists.length) { playlistsList.innerHTML = '<div class="empty">No playlists yet.</div>'; return; }
  playlistsList.innerHTML = '';
  playlists.forEach(pl => {
    const row = document.createElement('div'); row.className = 'playlist-row';
    row.innerHTML = `<span class="pname">${escapeHtml(pl.name)}</span><span class="pcount">${pl.tracks.length} trk</span><button class="pdel">\u2715</button>`;
    row.addEventListener('click', () => playAdhoc(pl.tracks, 0, pl.name));
    row.querySelector('.pdel').addEventListener('click', async (e) => {
      e.stopPropagation();
      try { const cur = (await store.get('ss_playlists')) || []; await store.set('ss_playlists', cur.filter(p => p.id !== pl.id)); await renderPlaylists(); }
      catch (err) { console.error('delete playlist failed', err); }
    });
    playlistsList.appendChild(row);
  });
}
renderPlaylists();

/* ---------- Visualizer (self-animated, no Web Audio graph — playback
   audio is never routed through anything mobile browsers can suspend) ---------- */
let visStyle = 'bars', silentFrames = 0;
document.querySelectorAll('.vis-tab').forEach(btn => {
  btn.addEventListener('click', () => { visStyle = btn.dataset.style; document.querySelectorAll('.vis-tab').forEach(b => b.classList.toggle('active', b === btn)); store.set('ss_vis_style', visStyle); });
});
async function restoreVisStyle() {
  const saved = await store.get('ss_vis_style');
  visStyle = saved || 'bars';
  document.querySelectorAll('.vis-tab').forEach(b => b.classList.toggle('active', b.dataset.style === visStyle));
}
restoreVisStyle();

function resizeVisCanvas() { visCanvas.width = visCanvas.clientWidth; visCanvas.height = visCanvas.clientHeight; }
window.addEventListener('resize', resizeVisCanvas);
window.addEventListener('load', resizeVisCanvas);
setTimeout(resizeVisCanvas, 300);

function pseudoLevel(i, t) { return (Math.sin(t*1.7+i*0.9)+Math.sin(t*3.1+i*1.7)*0.6+Math.sin(t*0.53+i*0.31)*0.8+2.4)/4.8; }

function drawBars() {
  const w = visCanvas.width, h = visCanvas.height, count = 28, gap = 2;
  const barW = (w - (count - 1) * gap) / count;
  const t = performance.now() / 1000;
  for (let i = 0; i < count; i++) {
    const v = audioEl.paused ? 0 : Math.max(0, pseudoLevel(i, t) - 0.15);
    const barH = Math.max(2, v * h);
    const x = i * (barW + gap), y = h - barH;
    const grad = visCtx.createLinearGradient(0, y, 0, h);
    grad.addColorStop(0, '#ffb199'); grad.addColorStop(1, REDC);
    visCtx.fillStyle = grad; visCtx.shadowColor = REDC; visCtx.shadowBlur = 4;
    visCtx.fillRect(x, y, barW, barH);
  }
}
function drawScope() {
  const w = visCanvas.width, h = visCanvas.height, N = 64;
  visCtx.beginPath();
  const t = performance.now() / 300;
  for (let i = 0; i < N; i++) {
    const v = audioEl.paused ? 0.5 : 0.5 + (pseudoLevel(i, t) - 0.5) * 0.5;
    const x = i / (N - 1) * w, y = v * h;
    if (i === 0) visCtx.moveTo(x, y); else visCtx.lineTo(x, y);
  }
  visCtx.strokeStyle = REDC; visCtx.lineWidth = 2; visCtx.shadowColor = REDC; visCtx.shadowBlur = 5;
  visCtx.stroke();
}
function drawDots() {
  const cols = 18, rows = 8, w = visCanvas.width, h = visCanvas.height;
  const cellW = w / cols, cellH = h / rows, t = performance.now() / 1000;
  for (let c = 0; c < cols; c++) {
    const v = audioEl.paused ? 0 : Math.max(0, pseudoLevel(c, t) - 0.15);
    const lit = Math.round(v * rows);
    for (let r = 0; r < rows; r++) {
      const isLit = r >= rows - lit;
      const cx = c * cellW + cellW / 2, cy = r * cellH + cellH / 2;
      visCtx.beginPath();
      visCtx.arc(cx, cy, Math.min(cellW, cellH) * 0.26, 0, Math.PI * 2);
      if (isLit) { visCtx.fillStyle = REDC; visCtx.shadowColor = REDC; visCtx.shadowBlur = 4; }
      else { visCtx.fillStyle = 'rgba(255,255,255,.07)'; visCtx.shadowBlur = 0; }
      visCtx.fill();
    }
  }
}
function drawVisualizer() {
  requestAnimationFrame(drawVisualizer);
  if (!visCanvas.width) return;
  visCtx.clearRect(0, 0, visCanvas.width, visCanvas.height);
  if (visStyle === 'scope') drawScope();
  else if (visStyle === 'dots') drawDots();
  else drawBars();
}
requestAnimationFrame(drawVisualizer);

/* ---------- Player / queue ---------- */
let queueTracks = [], order = [], pos = 0, shuffleOn = false, isPlayingIntent = false;

function playAdhoc(tracks, startIndex, label) {
  queueTracks = tracks; order = tracks.map((_, i) => i);
  if (shuffleOn) shuffleOrder(startIndex); else pos = startIndex;
  queueLabel.textContent = 'Playing: ' + label;
  deckWin.style.display = 'block'; deckWin.classList.remove('shaded');
  setTimeout(resizeVisCanvas, 50);
  loadRetries = 0;
  loadTrack(order[pos], true);
}
function shuffleOrder(keepIndex) {
  const current = keepIndex !== undefined ? keepIndex : (order.length ? order[pos] : undefined);
  order = queueTracks.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  if (current !== undefined) { const idx = order.indexOf(current); if (idx > -1) { order.splice(idx, 1); order.unshift(current); } }
  pos = 0;
}
shuffleBtn.addEventListener('click', () => {
  shuffleOn = !shuffleOn; shuffleBtn.classList.toggle('on', shuffleOn);
  if (!queueTracks.length) return;
  if (shuffleOn) { shuffleOrder(); } else { const current = order[pos]; order = queueTracks.map((_, i) => i); pos = order.indexOf(current); }
});

function updateMarquee() {
  npTitleWrap.classList.remove('scroll');
  requestAnimationFrame(() => {
    const overflow = npTitle.scrollWidth > npTitleWrap.clientWidth;
    if (overflow) {
      const dur = Math.max(6, npTitle.scrollWidth / 40);
      npTitle.style.animationDuration = dur + 's';
      npTitleWrap.classList.add('scroll');
    }
  });
}

/* ---------- Media Session (lock screen + Bluetooth/car stereo controls) ---------- */
const ARTWORK_SVG = 'data:image/svg+xml;base64,' + btoa(`
  <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"><rect width="512" height="512" fill="#0a0705"/>
  <g fill="#E8342A"><rect x="140" y="260" width="34" height="140"/><rect x="190" y="180" width="34" height="220"/>
  <rect x="240" y="120" width="34" height="280"/><rect x="290" y="220" width="34" height="180"/>
  <rect x="340" y="150" width="34" height="250"/></g></svg>
`);
function updateMediaSession(t, label) {
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.name, artist: 'Static Sounds', album: label || '',
      artwork: [{ src: ARTWORK_SVG, sizes: '512x512', type: 'image/svg+xml' }]
    });
  } catch (e) { console.error('mediaSession metadata failed', e); }
}
function setupMediaSessionHandlers() {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.setActionHandler('play', () => audioEl.play());
  navigator.mediaSession.setActionHandler('pause', () => audioEl.pause());
  navigator.mediaSession.setActionHandler('previoustrack', goPrev);
  navigator.mediaSession.setActionHandler('nexttrack', goNext);
  navigator.mediaSession.setActionHandler('stop', () => { audioEl.pause(); audioEl.currentTime = 0; });
  try { navigator.mediaSession.setActionHandler('seekto', (d) => { if (d.seekTime != null) audioEl.currentTime = d.seekTime; }); } catch (e) {}
}
setupMediaSessionHandlers();

/* Mobile browsers suspend the Web Audio graph (used for the EQ) when the
   screen locks or the tab backgrounds, which can silence playback even
   though the <audio> element itself is still "playing." Keep forcing it
   back awake so the EQ doesn't cost you background playback. */

function loadTrack(trackIndex, autoplay) {
  const t = queueTracks[trackIndex];
  if (!t) return;
  const myToken = ++loadToken;
  npTitle.textContent = t.name;
  updateMarquee();
  updateMediaSession(t, queueLabel.textContent.replace('Playing: ', ''));
  markActive(t.id, autoplay);
  loadTrackData(t, myToken, autoplay);
}

/* ---------- Fully-downloaded playback ----------
   Instead of pointing <audio> at a live Drive URL (which can freeze mid-song
   on any network blip), each track is fetched completely into memory first,
   then played from a local blob URL — no network involved once playback
   starts. The next track is prefetched in the background while the current
   one plays, so skipping doesn't hit the network at the moment you skip. */
let currentBlobUrl = null;
let nextPrefetch = { trackId: null, blobUrl: null, promise: null };
let loadToken = 0;

async function fetchTrackBlob(trackId) {
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${trackId}?alt=media&key=${API_KEY}`);
  if (!res.ok) throw new Error('Drive returned ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}

function peekNextTrackId() {
  if (!order.length) return null;
  const nextPos = (pos + 1) % order.length;
  const t = queueTracks[order[nextPos]];
  return t ? t.id : null;
}

function schedulePrefetchNext() {
  const tid = peekNextTrackId();
  if (!tid || tid === nextPrefetch.trackId) return;
  if (nextPrefetch.blobUrl) URL.revokeObjectURL(nextPrefetch.blobUrl);
  const entry = { trackId: tid, blobUrl: null, promise: null };
  nextPrefetch = entry;
  entry.promise = fetchTrackBlob(tid).then(url => {
    if (nextPrefetch === entry) entry.blobUrl = url;
    else URL.revokeObjectURL(url); // superseded while fetching
  }).catch(err => {
    console.error('prefetch failed', err);
    if (nextPrefetch === entry) nextPrefetch = { trackId: null, blobUrl: null, promise: null };
  });
}

async function loadTrackData(t, myToken, autoplay) {
  let blobUrl = null;
  try {
    if (nextPrefetch.trackId === t.id) {
      const entry = nextPrefetch;
      blobUrl = entry.blobUrl || (await entry.promise, entry.blobUrl);
      if (nextPrefetch === entry) nextPrefetch = { trackId: null, blobUrl: null, promise: null };
    }
    if (!blobUrl) { setStatus('Loading…'); blobUrl = await fetchTrackBlob(t.id); }
  } catch (err) {
    if (myToken !== loadToken) return;
    console.error('track load failed', err);
    retryOrSkip('download failed: ' + err.message);
    return;
  }
  if (myToken !== loadToken) { URL.revokeObjectURL(blobUrl); return; }
  if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
  currentBlobUrl = blobUrl;
  audioEl.src = blobUrl;
  setStatus('');
  if (autoplay) audioEl.play().catch(() => setStatus('Tap play to start.', 'err'));
  schedulePrefetchNext();
}
function markActive(trackId, playing) { document.querySelectorAll('.track').forEach(el => { const isActive = el.dataset.id === trackId; el.classList.toggle('active', isActive); el.classList.toggle('playing', isActive && playing); }); }
function setPlayingIcon(isPlaying) { playIcon.innerHTML = isPlaying ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>'; reel.classList.toggle('spinning', isPlaying); document.querySelectorAll('.track.active').forEach(el => el.classList.toggle('playing', isPlaying)); }
audioEl.addEventListener('play', () => { setPlayingIcon(true); isPlayingIntent = true; if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing'; });
audioEl.addEventListener('pause', () => { setPlayingIcon(false); isPlayingIntent = false; if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused'; });
playBtn.addEventListener('click', () => { if (!queueTracks.length) return; if (audioEl.paused) audioEl.play(); else audioEl.pause(); });
function goNext() { if (!order.length) return; loadRetries = 0; pos = (pos + 1) % order.length; loadTrack(order[pos], true); }
function goPrev() { if (!order.length) return; if (audioEl.currentTime > 3) { audioEl.currentTime = 0; return; } loadRetries = 0; pos = (pos - 1 + order.length) % order.length; loadTrack(order[pos], true); }
nextBtn.addEventListener('click', goNext);
prevBtn.addEventListener('click', goPrev);
stopBtn.addEventListener('click', () => { audioEl.pause(); audioEl.currentTime = 0; });
audioEl.addEventListener('ended', goNext);

/* ---------- Playback error recovery ----------
   Now mainly a safety net for the rare local decode hang, since network
   stalls mid-song shouldn't happen anymore once a track is fully downloaded
   before it starts playing. */
let loadRetries = 0;
let lastProgressTime = -1;
let stuckSince = 0;

function retryOrSkip(reason) {
  console.error('Playback recovery triggered:', reason);
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'none';
  stuckSince = 0;
  loadRetries++;
  if (loadRetries <= 2) {
    setStatus('Playback hiccup — retrying…', 'err');
    loadTrack(order[pos], true);
  } else {
    setStatus('That track kept failing — skipping ahead.', 'err');
    loadRetries = 0;
    goNext();
  }
}

audioEl.addEventListener('error', () => { if (isPlayingIntent) retryOrSkip('error event'); });
audioEl.addEventListener('playing', () => { loadRetries = 0; stuckSince = 0; });

/* Progress watchdog — the primary recovery mechanism. Runs every 3s. */
setInterval(() => {
  if (!isPlayingIntent || !queueTracks.length) { stuckSince = 0; lastProgressTime = -1; return; }
  const now = Date.now();
  const ct = audioEl.currentTime;
  if (ct !== lastProgressTime) {
    lastProgressTime = ct;
    stuckSince = 0;
    return;
  }
  // currentTime hasn't moved since the last check while we intend to be playing
  if (!stuckSince) stuckSince = now;
  if (now - stuckSince > 6000) { stuckSince = 0; retryOrSkip('no progress for 6s'); }
}, 3000);

audioEl.addEventListener('timeupdate', () => {
  if (!audioEl.duration) return;
  progressFill.style.width = (audioEl.currentTime/audioEl.duration*100)+'%';
  curTimeEl.textContent = fmtTime(audioEl.currentTime);
  if ('mediaSession' in navigator) { try { navigator.mediaSession.setPositionState({ duration: audioEl.duration, playbackRate: 1, position: audioEl.currentTime }); } catch (e) {} }
});
audioEl.addEventListener('loadedmetadata', () => { durTimeEl.textContent = fmtTime(audioEl.duration); });
progressTrack.addEventListener('click', (e) => { if (!audioEl.duration) return; const r = progressTrack.getBoundingClientRect(); audioEl.currentTime = ((e.clientX - r.left)/r.width) * audioEl.duration; });
function fmtTime(s){ if(!isFinite(s)) return '0:00'; const m=Math.floor(s/60); const sec=Math.floor(s%60).toString().padStart(2,'0'); return `${m}:${sec}`; }
</script>
