    background-size: cover;
    background-position: center top;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color:var(--caption); font-family:'Inter',sans-serif; min-height:100vh;
    padding:22px 12px 60px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:420px;margin:0 auto;}

  .win{
    background:linear-gradient(180deg, var(--metal-1), var(--metal-2));
    border:1px solid var(--line); border-radius:6px;
    box-shadow: inset 0 1px 0 var(--bezel-lt), inset 0 -2px 0 var(--bezel-dk), 0 14px 34px rgba(0,0,0,.5);
    margin-bottom:12px; overflow:hidden;
  }
  .win-title{
    display:flex;align-items:center;justify-content:space-between;padding:6px 8px;
    background:repeating-linear-gradient(-45deg, var(--metal-3) 0 2px, var(--metal-2) 2px 4px);
    border-bottom:1px solid var(--line);
  }
  .win-title .cap{font-family:'Inter',sans-serif;font-weight:700;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--caption);}
  .win-btns{display:flex;gap:4px;}
  .chip-btn{
    width:16px;height:14px;background:linear-gradient(180deg, var(--metal-1), var(--metal-2));
    border:1px solid var(--line);
    box-shadow: inset 1px 1px 0 var(--bezel-lt), inset -1px -1px 0 var(--bezel-dk);
    color:var(--caption); font-size:9px; line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:'JetBrains Mono',monospace;
  }
  .chip-btn:active{box-shadow: inset -1px -1px 0 var(--bezel-lt), inset 1px 1px 0 var(--bezel-dk);}
  .win-body{padding:12px;background:linear-gradient(180deg, var(--body-bg-2), var(--body-bg));}
  .win.shaded .win-body{display:none;}

  .brandbar{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 14px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .logo-mark{display:flex;align-items:flex-end;gap:2px;height:22px;}
  .logo-mark span{width:4px;background:var(--red);box-shadow:var(--red-glow);}
  .logo-mark span:nth-child(1){height:40%;} .logo-mark span:nth-child(2){height:70%;}
  .logo-mark span:nth-child(3){height:100%;} .logo-mark span:nth-child(4){height:55%;}
  .logo-mark span:nth-child(5){height:85%;}
  .wordmark{font-family:'VT323',monospace;font-size:26px;letter-spacing:.03em;line-height:1;color:var(--caption);}
  .wordmark b{color:var(--red);text-shadow:var(--red-glow);font-weight:400;}
  .theme-toggle{display:flex;gap:3px;}
  .theme-toggle .chip-btn{width:24px;height:20px;}
  .theme-toggle .chip-btn.active{background:linear-gradient(180deg, var(--red), var(--red-dim));color:#fff;}
  .theme-toggle svg{width:11px;height:11px;}

  .configWarn{background:var(--red-dim);border:1px solid var(--red);color:var(--caption);font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;border-radius:4px;padding:10px 12px;margin-bottom:12px;}

  label{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--caption-muted);margin:0 0 5px;}
  input[type=text]{
    width:100%;background:var(--lcd-bg);border:1px solid var(--line);
    box-shadow: inset 1px 1px 3px rgba(0,0,0,.8);
    border-radius:3px;color:var(--red);text-shadow:var(--red-glow);
    font-family:'JetBrains Mono',monospace;font-size:12px;padding:9px 10px;margin-bottom:9px;outline:none;
  }
  input[type=text]::placeholder{color:var(--red-dim);}

  .help{font-size:11px;color:var(--caption-muted);line-height:1.6;background:rgba(0,0,0,.15);border:1px dashed var(--line);border-radius:4px;padding:10px 12px;margin-bottom:12px;}

  button.primary{
    background:linear-gradient(180deg, var(--red), var(--red-dim));
    color:#fff;border:1px solid #000;border-radius:3px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -2px 0 rgba(0,0,0,.35);
    font-family:'Inter',sans-serif;font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;
    padding:9px 14px;cursor:pointer;width:100%;
  }
  button.primary:active{box-shadow: inset 0 2px 3px rgba(0,0,0,.5);}
  button.primary:disabled{opacity:.5;cursor:default;}
  button.ghost{
    background:linear-gradient(180deg, var(--metal-1), var(--metal-2));
    border:1px solid var(--line); color:var(--caption);
    box-shadow: inset 1px 1px 0 var(--bezel-lt), inset -1px -1px 0 var(--bezel-dk);
    border-radius:3px;font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:7px 11px;cursor:pointer;
    font-family:'Inter',sans-serif;font-weight:600;
  }
  button.ghost:active{box-shadow: inset -1px -1px 0 var(--bezel-lt), inset 1px 1px 0 var(--bezel-dk);}

  .status{font-size:11px;margin-top:6px;font-family:'JetBrains Mono',monospace;}
  .status.err{color:var(--danger);}
  .status.ok{color:var(--red);}
  .install-tip{font-size:10px;color:var(--caption-muted);text-align:center;margin-top:10px;font-family:'JetBrains Mono',monospace;line-height:1.6;}

  .lcd{
    background:var(--lcd-bg);border:1px solid #000;
    box-shadow: inset 1px 1px 4px rgba(0,0,0,.9);border-radius:3px;padding:10px 12px;
    background-image: repeating-linear-gradient(rgba(255,255,255,.025) 0 1px, transparent 1px 3px);
  }
  .deck{display:flex;gap:14px;align-items:center;}
  .reels{width:52px;height:52px;flex:none;position:relative;}
  .reel{width:100%;height:100%;border-radius:50%;background:repeating-conic-gradient(#1a1a1a 0deg 8deg, #050505 8deg 20deg);border:1px solid #000;animation:spin 3.2s linear infinite;animation-play-state:paused;}
  .reel.spinning{animation-play-state:running;}
  .reel::after{content:'';position:absolute;inset:0;margin:auto;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:var(--red-glow);}
  @keyframes spin{to{transform:rotate(360deg);}}
  .now-playing{min-width:0;flex:1;}
  .np-title-wrap{overflow:hidden;white-space:nowrap;margin:0 0 8px;}
  .np-title{font-family:'VT323',monospace;font-size:22px;line-height:1;color:var(--red);text-shadow:var(--red-glow);display:inline-block;}
  .np-title-wrap.scroll .np-title{padding-left:100%;animation:marquee linear infinite;}
  @keyframes marquee{from{transform:translateX(0);}to{transform:translateX(-100%);}}
  .progress-row{display:flex;align-items:center;gap:8px;font-family:'VT323',monospace;font-size:16px;color:var(--red);text-shadow:var(--red-glow);}
  .progress-track{flex:1;height:6px;background:#1a1310;border:1px solid #000;box-shadow:inset 1px 1px 2px rgba(0,0,0,.8);border-radius:2px;position:relative;cursor:pointer;}
  .progress-fill{position:absolute;left:0;top:0;bottom:0;background:var(--red);box-shadow:var(--red-glow);border-radius:2px;width:0%;}

  .vis-head{display:flex;align-items:center;justify-content:space-between;margin-top:10px;margin-bottom:6px;}
  .vis-head .cap-sm{font-family:'Inter',sans-serif;font-weight:700;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--caption-muted);}
  .vis-tabs{display:flex;gap:3px;}
  .vis-tab{
    background:linear-gradient(180deg, var(--metal-1), var(--metal-2));
    border:1px solid var(--line);color:var(--caption-muted);
    box-shadow: inset 1px 1px 0 var(--bezel-lt), inset -1px -1px 0 var(--bezel-dk);
    font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.05em;
    padding:3px 7px;border-radius:2px;cursor:pointer;
  }
  .vis-tab.active{background:linear-gradient(180deg, var(--red), var(--red-dim));color:#fff;border-color:#000;}
  .vis-canvas{width:100%;height:72px;display:block;background:var(--lcd-bg);border:1px solid #000;box-shadow:inset 1px 1px 4px rgba(0,0,0,.9);border-radius:3px;}

  .controls{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;}
  .ctrl-btn{
    background:linear-gradient(180deg, var(--metal-1), var(--metal-2));
    border:1px solid var(--line); color:var(--caption);
    box-shadow: inset 1px 1px 0 var(--bezel-lt), inset -1px -1px 0 var(--bezel-dk);
    width:34px;height:30px;border-radius:3px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .ctrl-btn:active{box-shadow: inset -1px -1px 0 var(--bezel-lt), inset 1px 1px 0 var(--bezel-dk);}
  .ctrl-btn.play{width:44px;background:linear-gradient(180deg, var(--red), var(--red-dim));color:#fff;border-color:#000;}
  .ctrl-btn.shuffle.on{color:var(--red);box-shadow: inset 0 0 0 1px var(--red), inset 1px 1px 0 var(--bezel-lt);}
  .ctrl-btn svg{width:14px;height:14px;}
  .ctrl-btn.play svg{width:17px;height:17px;}

  .eq-toggle-row{display:flex;justify-content:flex-end;margin:10px 0 0;}
  .eq-panel{display:none;border-top:1px solid var(--line);margin-top:10px;padding-top:12px;}
  .eq-panel.show{display:block;}
  .eq-bands{display:flex;justify-content:space-between;gap:5px;}
  .eq-band{display:flex;flex-direction:column;align-items:center;flex:1;}
  .eq-val{font-family:'VT323',monospace;font-size:13px;color:var(--red);text-shadow:var(--red-glow);margin-bottom:4px;height:14px;}
  .eq-slider-wrap{height:96px;display:flex;align-items:center;justify-content:center;width:100%;}
  .eq-band input[type=range]{width:88px; transform:rotate(-90deg); accent-color:var(--red); cursor:pointer;}
  .eq-freq{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--caption-muted);margin-top:5px;}
  .eq-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
  .eq-foot span{font-size:10px;color:var(--caption-muted);font-family:'JetBrains Mono',monospace;}

  .folder-group{margin-bottom:12px;}
  .folder-head{display:flex;align-items:center;justify-content:space-between;padding:3px 2px;margin-bottom:2px;border-bottom:1px solid var(--line);}
  .folder-head .fname{font-family:'Inter',sans-serif;font-weight:700;font-size:11px;color:var(--caption);text-transform:uppercase;letter-spacing:.03em;}
  .folder-head .fcount{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--caption-muted);}
  .folder-head .remove{background:none;border:none;color:var(--caption-muted);cursor:pointer;font-size:10px;}
  .track{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:2px;cursor:pointer;font-size:12px;}
  .track:hover{background:rgba(255,255,255,.04);}
  .track.active{background:var(--red-dim);}
  .track input[type=checkbox]{accent-color:var(--red);flex:none;}
  .track-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'JetBrains Mono',monospace;}
  .track.active .track-name{color:var(--red);}
  .track-eq{width:12px;flex:none;display:none;}
  .track.active .track-eq{display:block;}
  .eq-bar{display:inline-block;width:2px;background:var(--red);margin-right:2px;height:5px;vertical-align:middle;}
  .track.playing .eq-bar{animation:eqbar 0.8s ease-in-out infinite alternate;}
  .eq-bar:nth-child(2){animation-delay:.15s;}
  .eq-bar:nth-child(3){animation-delay:.3s;}
  @keyframes eqbar{from{height:2px;}to{height:9px;}}

  .selection-bar{position:sticky;bottom:0;background:var(--metal-2);border:1px solid var(--red);border-radius:3px;padding:10px;display:none;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap;}
  .selection-bar.show{display:flex;}
  .selection-bar span{font-size:11px;color:var(--caption-muted);flex:1 1 100%;font-family:'JetBrains Mono',monospace;}
  .selection-bar input{margin:0;flex:1;min-width:100px;}
  .selection-bar button{flex:none;}

  .playlist-row{display:flex;align-items:center;gap:8px;padding:8px 6px;border-radius:2px;cursor:pointer;border-bottom:1px solid var(--line);}
  .playlist-row:hover{background:rgba(255,255,255,.04);}
  .playlist-row .pname{flex:1;font-size:12px;font-weight:600;font-family:'JetBrains Mono',monospace;}
  .playlist-row .pcount{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--caption-muted);}
  .playlist-row .pdel{background:none;border:none;color:var(--caption-muted);cursor:pointer;font-size:13px;padding:2px 5px;}
  .playlist-row .pdel:hover{color:var(--danger);}

  .empty{text-align:center;color:var(--caption-muted);font-size:12px;padding:16px 8px;font-family:'JetBrains Mono',monospace;}
  footer{text-align:center;color:var(--caption-muted);font-size:10px;margin-top:18px;font-family:'JetBrains Mono',monospace;opacity:.7;}
</style>
</head>
<body>
<div class="wrap">

  <div class="brandbar">
    <div class="brand">
      <div class="logo-mark"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="wordmark">STATIC <b>SOUNDS</b></div>
    </div>
    <div class="theme-toggle" id="themeToggle">
      <button class="chip-btn" id="darkBtn" title="Dark"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg></button>
      <button class="chip-btn" id="lightBtn" title="Light"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/></svg></button>
    </div>
  </div>

  <div id="configWarn" class="configWarn" style="display:none;"></div>

  <!-- Deck: now at the top -->
  <div class="win" id="deckWin" style="display:none;">
    <div class="win-title"><span class="cap" id="queueLabel">Now playing</span><div class="win-btns"><button class="chip-btn shade-btn" data-target="deckWin">_</button></div></div>
    <div class="win-body">
      <div class="lcd">
        <div class="deck">
          <div class="reels"><div class="reel" id="reel"></div></div>
          <div class="now-playing">
            <div class="np-title-wrap" id="npTitleWrap"><span class="np-title" id="npTitle">—</span></div>
            <div class="progress-row">
              <span id="curTime">0:00</span>
              <div class="progress-track" id="progressTrack"><div class="progress-fill" id="progressFill"></div></div>
              <span id="durTime">0:00</span>
            </div>
          </div>
        </div>
        <div class="vis-head">
          <span class="cap-sm">Visualizer</span>
          <div class="vis-tabs">
            <button class="vis-tab" data-style="bars">BAR</button>
            <button class="vis-tab" data-style="scope">WAV</button>
            <button class="vis-tab" data-style="dots">DOT</button>
          </div>
        </div>
        <canvas class="vis-canvas" id="visCanvas"></canvas>
      </div>
      <div class="controls">
        <button class="ctrl-btn shuffle" id="shuffleBtn" title="Shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg></button>
        <button class="ctrl-btn" id="prevBtn" title="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
        <button class="ctrl-btn play" id="playBtn" title="Play/Pause"><svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="ctrl-btn" id="stopBtn" title="Stop"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12"/></svg></button>
        <button class="ctrl-btn" id="nextBtn" title="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg></button>
      </div>
      <div class="eq-toggle-row"><button class="ghost" id="eqToggle">5-Band EQ</button></div>
      <div class="eq-panel" id="eqPanel">
        <div class="eq-bands" id="eqBands"></div>
        <div class="eq-foot"><span>±12dB PEAK</span><button class="ghost" id="eqReset">Reset</button></div>
      </div>
    </div>
  </div>

  <div class="win" id="playlistsWin">
    <div class="win-title"><span class="cap">Playlists</span><div class="win-btns"><button class="chip-btn shade-btn" data-target="playlistsWin">_</button></div></div>
    <div class="win-body">
      <div id="playlistsList"><div class="empty">No playlists yet.</div></div>
    </div>
  </div>

  <div class="win" id="libraryWin">
    <div class="win-title"><span class="cap">Library</span><div class="win-btns"><button class="chip-btn shade-btn" data-target="libraryWin">_</button></div></div>
    <div class="win-body">
      <div id="libraryList"><div class="empty">Loading your folder…</div></div>
      <div class="selection-bar" id="selectionBar">
        <span id="selectionCount">0 selected</span>
        <input type="text" id="playlistNameInput" placeholder="Playlist name">
        <button class="ghost" id="saveSelectionBtn">Save</button>
        <button class="ghost" id="playSelectionBtn">Play now</button>
      </div>
    </div>
  </div>

  <!-- Add folder: now at the bottom -->
  <div class="win" id="addFolderWin">
    <div class="win-title"><span class="cap">Source</span><div class="win-btns"><button class="chip-btn shade-btn" data-target="addFolderWin">_</button></div></div>
    <div class="win-body">
      <label for="folderInput">Drive folder link or ID</label>
      <input type="text" id="folderInput" placeholder="https://drive.google.com/drive/folders/…">
      <button class="primary" id="addFolderBtn">Add folder</button>
      <div id="statusMsg" class="status"></div>
      <p class="install-tip">Add to Home Screen for an app icon.</p>
    </div>
  </div>

  <footer>static sounds · streams directly from a public google drive folder</footer>
</div>

<audio id="audioEl" preload="none" crossorigin="anonymous"></audio>

<script>
/* =========================================================================
   CONFIG
   ========================================================================= */
const API_KEY = 'AIzaSyDTD4v7TCNL8CzImICG3b_Wefiaz1Nw0aU';
const DEFAULT_FOLDER_ID = '1AcBAI4uLHdb3HRcwyKzno60WhK57PhoJ';
/* ========================================================================= */

const els = id => document.getElementById(id);
const configWarn = els('configWarn');
const folderInput = els('folderInput'), addFolderBtn = els('addFolderBtn'), statusMsg = els('statusMsg');
const libraryList = els('libraryList'), playlistsList = els('playlistsList');
const selectionBar = els('selectionBar'), selectionCount = els('selectionCount'), playlistNameInput = els('playlistNameInput');
const deckWin = els('deckWin'), queueLabel = els('queueLabel');
const npTitle = els('npTitle'), reel = els('reel'), audioEl = els('audioEl');
const playBtn = els('playBtn'), playIcon = els('playIcon'), prevBtn = els('prevBtn'), nextBtn = els('nextBtn'), shuffleBtn = els('shuffleBtn'), stopBtn = els('stopBtn');
const npTitleWrap = els('npTitleWrap');
const progressTrack = els('progressTrack'), progressFill = els('progressFill'), curTimeEl = els('curTime'), durTimeEl = els('durTime');
const eqToggle = els('eqToggle'), eqPanel = els('eqPanel'), eqBands = els('eqBands'), eqReset = els('eqReset');
const darkBtn = els('darkBtn'), lightBtn = els('lightBtn');
const visCanvas = els('visCanvas'), visCtx = visCanvas.getContext('2d');

if (!API_KEY || API_KEY === 'YOUR_API_KEY') {
  configWarn.style.display = 'block';
  configWarn.textContent = 'Setup needed: replace API_KEY at the top of the script.';
  libraryList.innerHTML = '<div class="empty">Add your API key to load the preloaded folder.</div>';
} else {
  window.addEventListener('DOMContentLoaded', () => addFolder(DEFAULT_FOLDER_ID));
}

/* ---------- Window shade toggles ---------- */
document.querySelectorAll('.shade-btn').forEach(btn => {
  btn.addEventListener('click', () => { els(btn.dataset.target).classList.toggle('shaded'); });
});
eqToggle.addEventListener('click', () => eqPanel.classList.toggle('show'));

/* ---------- Storage ---------- */
const store = {
  async get(key) {
    if (window.storage) { try { const r = await window.storage.get(key); return r ? JSON.parse(r.value) : null; } catch (e) { return null; } }
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch (e) { console.error('store.get failed', key, e); return null; }
  },
  async set(key, value) {
    if (window.storage) { try { await window.storage.set(key, JSON.stringify(value)); return true; } catch (e) { console.error('window.storage.set failed', key, e); } }
    try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { console.error('localStorage.set failed', key, e); return false; }
  }
};

/* ---------- Theme ---------- */
let REDC = '#FF2B22';
function refreshRedColor() { REDC = getComputedStyle(document.documentElement).getPropertyValue('--red').trim() || REDC; }
async function initTheme() {
  let theme = await store.get('ss_theme');
  if (!theme) theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  applyTheme(theme);
}
function applyTheme(theme) { document.documentElement.setAttribute('data-theme', theme); darkBtn.classList.toggle('active', theme === 'dark'); lightBtn.classList.toggle('active', theme === 'light'); refreshRedColor(); }
darkBtn.addEventListener('click', () => { applyTheme('dark'); store.set('ss_theme', 'dark'); });
lightBtn.addEventListener('click', () => { applyTheme('light'); store.set('ss_theme', 'light'); });
initTheme();

/* ---------- Library ---------- */
let folders = [];
let selected = new Map();
function extractFolderId(raw) { raw = raw.trim(); const m = raw.match(/folders\/([a-zA-Z0-9_-]+)/); if (m) return m[1]; const m2 = raw.match(/[-\w]{25,}/); if (m2) return m2[0]; return raw; }
function setStatus(msg, type) { statusMsg.textContent = msg || ''; statusMsg.className = 'status' + (type ? ' ' + type : ''); }
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

addFolderBtn.addEventListener('click', () => addFolder(folderInput.value));

async function addFolder(rawInput) {
  const folderId = extractFolderId(rawInput);
  if (!folderId) { setStatus('Paste a folder link or ID first.', 'err'); return; }
  if (folders.some(f => f.id === folderId)) { setStatus('That folder is already loaded.', 'err'); return; }
  addFolderBtn.disabled = true; setStatus('Reading the folder…');
  try {
    const [metaRes, listRes] = await Promise.all([
      fetch(`https://www.googleapis.com/drive/v3/files/${folderId}?fields=id,name&key=${API_KEY}`),
      fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(`'${folderId}' in parents and (mimeType contains 'audio/' or mimeType='video/mp4') and trashed=false`)}&fields=${encodeURIComponent('files(id,name,mimeType)')}&pageSize=1000&key=${API_KEY}`)
    ]);
    if (!metaRes.ok || !listRes.ok) { const err = !metaRes.ok ? await metaRes.json().catch(()=>({})) : await listRes.json().catch(()=>({})); throw new Error(err?.error?.message || 'Drive request failed — check the folder is shared as "Anyone with the link."'); }
    const meta = await metaRes.json(); const list = await listRes.json();
    const tracks = (list.files || []).sort((a,b) => a.name.localeCompare(b.name, undefined, {numeric:true})).map(f => ({ id: f.id, name: f.name.replace(/\.[^/.]+$/, '') }));
    if (!tracks.length) { setStatus('That folder loaded, but no audio files turned up in it.', 'err'); addFolderBtn.disabled = false; return; }
    folders.push({ id: folderId, name: meta.name || 'Untitled folder', tracks });
    if (folderInput.value.trim() === rawInput.trim()) folderInput.value = '';
    setStatus(`Loaded "${meta.name}" — ${tracks.length} track${tracks.length===1?'':'s'}.`, 'ok');
    renderLibrary();
  } catch (err) { console.error('addFolder failed', err); setStatus("Couldn't load that folder — " + err.message, 'err'); }
  finally { addFolderBtn.disabled = false; }
}

function renderLibrary() {
  if (!folders.length) { libraryList.innerHTML = '<div class="empty">No folders loaded yet.</div>'; return; }
  libraryList.innerHTML = '';
  folders.forEach(folder => {
    const group = document.createElement('div'); group.className = 'folder-group';
    group.innerHTML = `<div class="folder-head"><span class="fname">${escapeHtml(folder.name)}</span><span class="fcount">${folder.tracks.length} trk</span><button class="remove" data-folder="${folder.id}">remove</button></div>`;
    const list = document.createElement('div');
    folder.tracks.forEach(t => {
      const row = document.createElement('div'); row.className = 'track'; row.dataset.id = t.id;
      row.innerHTML = `<input type="checkbox" ${selected.has(t.id) ? 'checked' : ''}><span class="track-name">${folder.tracks.indexOf(t) + 1}. ${escapeHtml(t.name)}</span><span class="track-eq"><span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span></span>`;
      row.querySelector('input').addEventListener('change', (e) => { if (e.target.checked) selected.set(t.id, t); else selected.delete(t.id); updateSelectionBar(); });
      row.querySelector('.track-name').addEventListener('click', () => playAdhoc(folder.tracks, folder.tracks.indexOf(t), folder.name));
      list.appendChild(row);
    });
    group.appendChild(list);
    group.querySelector('.remove').addEventListener('click', () => { folders = folders.filter(f => f.id !== folder.id); renderLibrary(); });
    libraryList.appendChild(group);
  });
}
function updateSelectionBar() { selectionBar.classList.toggle('show', selected.size > 0); selectionCount.textContent = `${selected.size} selected`; }

els('saveSelectionBtn').addEventListener('click', async () => {
  const name = playlistNameInput.value.trim();
  if (!name) { setStatus('Give the playlist a name.', 'err'); return; }
  if (!selected.size) { setStatus('Check at least one track first.', 'err'); return; }
  try {
    const playlists = (await store.get('ss_playlists')) || [];
    playlists.push({ id: 'pl_' + Date.now(), name, tracks: Array.from(selected.values()) });
    const ok = await store.set('ss_playlists', playlists);
    if (!ok) { setStatus('Could not save — your browser may be blocking local storage.', 'err'); return; }
    selected.clear(); playlistNameInput.value = ''; updateSelectionBar(); renderLibrary();
    await renderPlaylists();
    setStatus(`Saved playlist "${name}".`, 'ok');
  } catch (err) { console.error('save playlist failed', err); setStatus('Could not save that playlist — ' + err.message, 'err'); }
});
els('playSelectionBtn').addEventListener('click', () => { if (!selected.size) { setStatus('Check at least one track first.', 'err'); return; } playAdhoc(Array.from(selected.values()), 0, 'Selection'); });

async function renderPlaylists() {
  let playlists = [];
  try { playlists = (await store.get('ss_playlists')) || []; } catch (err) { console.error('load playlists failed', err); }
  if (!playlists.length) { playlistsList.innerHTML = '<div class="empty">No playlists yet.</div>'; return; }
  playlistsList.innerHTML = '';
  playlists.forEach(pl => {
    const row = document.createElement('div'); row.className = 'playlist-row';
    row.innerHTML = `<span class="pname">${escapeHtml(pl.name)}</span><span class="pcount">${pl.tracks.length} trk</span><button class="pdel">\u2715</button>`;
    row.addEventListener('click', () => playAdhoc(pl.tracks, 0, pl.name));
    row.querySelector('.pdel').addEventListener('click', async (e) => {
      e.stopPropagation();
      try { const cur = (await store.get('ss_playlists')) || []; await store.set('ss_playlists', cur.filter(p => p.id !== pl.id)); await renderPlaylists(); }
      catch (err) { console.error('delete playlist failed', err); }
    });
    playlistsList.appendChild(row);
  });
}
renderPlaylists();

/* ---------- 5-band EQ ---------- */
const EQ_BANDS = [60, 250, 1000, 4000, 12000];
const EQ_LABELS = ['60', '250', '1K', '4K', '12K'];
let audioCtx = null, filters = [], analyser = null, freqData = null, timeData = null, audioGraphReady = false;

function buildEqUi() {
  eqBands.innerHTML = '';
  EQ_BANDS.forEach((freq, i) => {
    const band = document.createElement('div'); band.className = 'eq-band';
    band.innerHTML = `<div class="eq-val" id="eqVal${i}">0dB</div><div class="eq-slider-wrap"><input type="range" min="-12" max="12" value="0" step="1" id="eqSlider${i}"></div><div class="eq-freq">${EQ_LABELS[i]}</div>`;
    eqBands.appendChild(band);
  });
  EQ_BANDS.forEach((freq, i) => {
    els('eqSlider' + i).addEventListener('input', (e) => {
      const v = Number(e.target.value);
      els('eqVal' + i).textContent = (v > 0 ? '+' : '') + v + 'dB';
      if (filters[i]) filters[i].gain.value = v;
      saveEqSettings();
    });
  });
}
buildEqUi();
async function saveEqSettings() { const values = EQ_BANDS.map((_, i) => Number(els('eqSlider' + i).value)); await store.set('ss_eq', values); }
async function restoreEqSettings() { const values = await store.get('ss_eq'); if (!values) return; values.forEach((v, i) => { const s = els('eqSlider' + i); if (s) { s.value = v; s.dispatchEvent(new Event('input')); } }); }
restoreEqSettings();
eqReset.addEventListener('click', () => { EQ_BANDS.forEach((_, i) => { const s = els('eqSlider' + i); s.value = 0; s.dispatchEvent(new Event('input')); }); });

function setupAudioGraph() {
  if (audioGraphReady) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const sourceNode = audioCtx.createMediaElementSource(audioEl);
    filters = EQ_BANDS.map((freq, i) => {
      const f = audioCtx.createBiquadFilter();
      f.type = 'peaking'; f.frequency.value = freq; f.Q.value = 1;
      f.gain.value = Number(els('eqSlider' + i).value);
      return f;
    });
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.75;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    timeData = new Uint8Array(analyser.fftSize);
    let node = sourceNode;
    filters.forEach(f => { node.connect(f); node = f; });
    node.connect(analyser);
    analyser.connect(audioCtx.destination);
    audioGraphReady = true;
  } catch (e) { console.error('Web Audio graph unavailable — EQ/visualizer disabled, playback unaffected', e); }
}

/* ---------- Visualizer ---------- */
let visStyle = 'bars', silentFrames = 0;
document.querySelectorAll('.vis-tab').forEach(btn => {
  btn.addEventListener('click', () => { visStyle = btn.dataset.style; document.querySelectorAll('.vis-tab').forEach(b => b.classList.toggle('active', b === btn)); store.set('ss_vis_style', visStyle); });
});
async function restoreVisStyle() {
  const saved = await store.get('ss_vis_style');
  visStyle = saved || 'bars';
  document.querySelectorAll('.vis-tab').forEach(b => b.classList.toggle('active', b.dataset.style === visStyle));
}
restoreVisStyle();

function resizeVisCanvas() { visCanvas.width = visCanvas.clientWidth; visCanvas.height = visCanvas.clientHeight; }
window.addEventListener('resize', resizeVisCanvas);
window.addEventListener('load', resizeVisCanvas);
setTimeout(resizeVisCanvas, 300);

function pseudoLevel(i, t) { return (Math.sin(t*1.7+i*0.9)+Math.sin(t*3.1+i*1.7)*0.6+Math.sin(t*0.53+i*0.31)*0.8+2.4)/4.8; }

function drawBars(simulated) {
  const w = visCanvas.width, h = visCanvas.height, count = 28, gap = 2;
  const barW = (w - (count - 1) * gap) / count;
  const t = performance.now() / 1000;
  for (let i = 0; i < count; i++) {
    let v;
    if (simulated) v = audioEl.paused ? 0 : Math.max(0, pseudoLevel(i, t) - 0.15);
    else { const idx = Math.floor(i / count * freqData.length); v = freqData[idx] / 255; }
    const barH = Math.max(2, v * h);
    const x = i * (barW + gap), y = h - barH;
    const grad = visCtx.createLinearGradient(0, y, 0, h);
    grad.addColorStop(0, '#ffb199'); grad.addColorStop(1, REDC);
    visCtx.fillStyle = grad; visCtx.shadowColor = REDC; visCtx.shadowBlur = 4;
    visCtx.fillRect(x, y, barW, barH);
  }
}
function drawScope(simulated) {
  const w = visCanvas.width, h = visCanvas.height, N = 64;
  if (!simulated) analyser.getByteTimeDomainData(timeData);
  visCtx.beginPath();
  const t = performance.now() / 300;
  for (let i = 0; i < N; i++) {
    let v;
    if (simulated) v = audioEl.paused ? 0.5 : 0.5 + (pseudoLevel(i, t) - 0.5) * 0.5;
    else { const idx = Math.floor(i / N * timeData.length); v = timeData[idx] / 255; }
    const x = i / (N - 1) * w, y = v * h;
    if (i === 0) visCtx.moveTo(x, y); else visCtx.lineTo(x, y);
  }
  visCtx.strokeStyle = REDC; visCtx.lineWidth = 2; visCtx.shadowColor = REDC; visCtx.shadowBlur = 5;
  visCtx.stroke();
}
function drawDots(simulated) {
  const cols = 18, rows = 8, w = visCanvas.width, h = visCanvas.height;
  const cellW = w / cols, cellH = h / rows, t = performance.now() / 1000;
  for (let c = 0; c < cols; c++) {
    let v;
    if (simulated) v = audioEl.paused ? 0 : Math.max(0, pseudoLevel(c, t) - 0.15);
    else { const idx = Math.floor(c / cols * freqData.length); v = freqData[idx] / 255; }
    const lit = Math.round(v * rows);
    for (let r = 0; r < rows; r++) {
      const isLit = r >= rows - lit;
      const cx = c * cellW + cellW / 2, cy = r * cellH + cellH / 2;
      visCtx.beginPath();
      visCtx.arc(cx, cy, Math.min(cellW, cellH) * 0.26, 0, Math.PI * 2);
      if (isLit) { visCtx.fillStyle = REDC; visCtx.shadowColor = REDC; visCtx.shadowBlur = 4; }
      else { visCtx.fillStyle = 'rgba(255,255,255,.07)'; visCtx.shadowBlur = 0; }
      visCtx.fill();
    }
  }
}
function drawVisualizer() {
  requestAnimationFrame(drawVisualizer);
  if (!visCanvas.width) return;
  visCtx.clearRect(0, 0, visCanvas.width, visCanvas.height);
  let hasSignal = false;
  if (analyser) { analyser.getByteFrequencyData(freqData); hasSignal = freqData.some(v => v > 2); }
  if (!hasSignal && !audioEl.paused) silentFrames++; else silentFrames = Math.max(0, silentFrames - 2);
  const simulated = silentFrames > 40;
  if (visStyle === 'scope') drawScope(simulated);
  else if (visStyle === 'dots') drawDots(simulated);
  else drawBars(simulated);
}
requestAnimationFrame(drawVisualizer);

/* ---------- Player / queue ---------- */
let queueTracks = [], order = [], pos = 0, shuffleOn = false;

function playAdhoc(tracks, startIndex, label) {
  queueTracks = tracks; order = tracks.map((_, i) => i);
  if (shuffleOn) shuffleOrder(startIndex); else pos = startIndex;
  queueLabel.textContent = 'Playing: ' + label;
  deckWin.style.display = 'block'; deckWin.classList.remove('shaded');
  setTimeout(resizeVisCanvas, 50);
  loadTrack(order[pos], true);
}
function shuffleOrder(keepIndex) {
  const current = keepIndex !== undefined ? keepIndex : (order.length ? order[pos] : undefined);
  order = queueTracks.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  if (current !== undefined) { const idx = order.indexOf(current); if (idx > -1) { order.splice(idx, 1); order.unshift(current); } }
  pos = 0;
}
shuffleBtn.addEventListener('click', () => {
  shuffleOn = !shuffleOn; shuffleBtn.classList.toggle('on', shuffleOn);
  if (!queueTracks.length) return;
  if (shuffleOn) { shuffleOrder(); } else { const current = order[pos]; order = queueTracks.map((_, i) => i); pos = order.indexOf(current); }
});

function updateMarquee() {
  npTitleWrap.classList.remove('scroll');
  requestAnimationFrame(() => {
    const overflow = npTitle.scrollWidth > npTitleWrap.clientWidth;
    if (overflow) {
      const dur = Math.max(6, npTitle.scrollWidth / 40);
      npTitle.style.animationDuration = dur + 's';
      npTitleWrap.classList.add('scroll');
    }
  });
}

function loadTrack(trackIndex, autoplay) {
  const t = queueTracks[trackIndex];
  if (!t) return;
  npTitle.textContent = t.name;
  updateMarquee();
  markActive(t.id, autoplay);
  audioEl.src = `https://www.googleapis.com/drive/v3/files/${t.id}?alt=media&key=${API_KEY}`;
  setupAudioGraph();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  if (autoplay) audioEl.play().catch(() => setStatus('Tap play to start.', 'err'));
}
function markActive(trackId, playing) { document.querySelectorAll('.track').forEach(el => { const isActive = el.dataset.id === trackId; el.classList.toggle('active', isActive); el.classList.toggle('playing', isActive && playing); }); }
function setPlayingIcon(isPlaying) { playIcon.innerHTML = isPlaying ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>'; reel.classList.toggle('spinning', isPlaying); document.querySelectorAll('.track.active').forEach(el => el.classList.toggle('playing', isPlaying)); }
audioEl.addEventListener('play', () => setPlayingIcon(true));
audioEl.addEventListener('pause', () => setPlayingIcon(false));
playBtn.addEventListener('click', () => { if (!queueTracks.length) return; if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); if (audioEl.paused) audioEl.play(); else audioEl.pause(); });
function goNext() { if (!order.length) return; pos = (pos + 1) % order.length; loadTrack(order[pos], true); }
function goPrev() { if (!order.length) return; if (audioEl.currentTime > 3) { audioEl.currentTime = 0; return; } pos = (pos - 1 + order.length) % order.length; loadTrack(order[pos], true); }
nextBtn.addEventListener('click', goNext);
prevBtn.addEventListener('click', goPrev);
stopBtn.addEventListener('click', () => { audioEl.pause(); audioEl.currentTime = 0; });
audioEl.addEventListener('ended', goNext);
audioEl.addEventListener('timeupdate', () => { if (!audioEl.duration) return; progressFill.style.width = (audioEl.currentTime/audioEl.duration*100)+'%'; curTimeEl.textContent = fmtTime(audioEl.currentTime); });
audioEl.addEventListener('loadedmetadata', () => { durTimeEl.textContent = fmtTime(audioEl.duration); });
progressTrack.addEventListener('click', (e) => { if (!audioEl.duration) return; const r = progressTrack.getBoundingClientRect(); audioEl.currentTime = ((e.clientX - r.left)/r.width) * audioEl.duration; });
function fmtTime(s){ if(!isFinite(s)) return '0:00'; const m=Math.floor(s/60); const sec=Math.floor(s%60).toString().padStart(2,'0'); return `${m}:${sec}`; }
</script>
